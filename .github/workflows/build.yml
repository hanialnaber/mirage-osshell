name: Build and test

# Builds Mirage on real Windows and Mac machines, runs its smoke test there
# (start every view, measure memory and CPU, screenshot the screen), then
# renders the two promo videos and the site's screenshots from the demo stage.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build installer
        working-directory: app/src-tauri
        env: { LIBCLANG_PATH: 'C:\Program Files\LLVM\bin' }
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Smoke test on the Windows desktop
        shell: pwsh
        run: app/tools/ci/smoke-win.ps1 -Exe app/src-tauri/target/release/mirage.exe -Out out
      - name: Collect
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/Mirage-Windows-Setup.exe
          "{0:N1} MB installer" -f ($setup.Length / 1MB)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows, path: out, if-no-files-found: warn }

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build app and disk image
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles app,dmg
      - name: Smoke test on the Mac desktop
        run: app/tools/ci/smoke-mac.sh app/src-tauri/target/release/bundle/macos/Mirage.app out
      - name: Collect
        run: |
          cp app/src-tauri/target/release/bundle/dmg/*.dmg out/Mirage-macOS.dmg
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: macos, path: out, if-no-files-found: warn }

  media:
    needs: [windows, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { path: smoke }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          cd app/tools/media && npm init -y > /dev/null && npm i --no-save playwright-core@1.49.1
      - name: Render videos and screenshots
        run: |
          read_smoke() { node -e "try{const r=require(process.argv[1]);console.log(r.mirage_mem_mb.toFixed(0)+' '+r.mirage_cpu_avg_pct.toFixed(1))}catch{console.log('')}" "$1"; }
          W=$(read_smoke "$PWD/smoke/windows/smoke-windows.json"); M=$(read_smoke "$PWD/smoke/macos/smoke-macos.json")
          echo "Windows smoke: $W  Mac smoke: $M"
          set -- $W; WARGS=${1:+--mem $1 --cpu $2}
          set -- $M; MARGS=${1:+--mem $1 --cpu $2}
          node app/tools/media/render.mjs --os win --out media $WARGS
          node app/tools/media/render.mjs --os mac --out media $MARGS
          cp smoke/windows/*.png smoke/windows/*.json media/ 2>/dev/null || true
          cp smoke/macos/*.png smoke/macos/*.json media/ 2>/dev/null || true
          ls -la media
      - uses: actions/upload-artifact@v4
        with: { name: media, path: media }
      - name: Publish media to the media branch
        # Videos, screenshots and smoke results go to an orphan "media" branch
        # (replaced on every run, so main's history stays small).
        if: github.ref == 'refs/heads/main'
        run: |
          cd media
          git init -q -b media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Videos, screenshots and smoke results for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" media
