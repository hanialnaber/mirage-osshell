name: Release

# Run by hand from the Actions tab. Builds the Windows installer and the Mac
# disk image (Apple silicon and Intel) and publishes them as a GitHub release.
# The apps are not code-signed, so Windows SmartScreen and macOS Gatekeeper
# ask once on first open; the site explains both.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v2.0.0
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: app/src-tauri
        env: { LIBCLANG_PATH: 'C:\Program Files\LLVM\bin' }
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName out/Mirage-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app,dmg
      - run: |
          mkdir -p out
          cp app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/Mirage-macOS.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out }

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "${{ inputs.tag }}" dist/Mirage-Windows-Setup.exe dist/Mirage-macOS.dmg \
            --title "Mirage ${{ inputs.tag }}" --latest \
            --notes "Mirage for Windows 10/11 and macOS 11 or later. Both builds are free and not code-signed: on Windows choose More info, then Run anyway; on a Mac open System Settings, Privacy & Security, then Open Anyway. The Mac version has had less testing than the Windows one."
