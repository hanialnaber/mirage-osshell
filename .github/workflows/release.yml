# Builds Mirage on Windows, runs the tests and publishes a GitHub release with the installer and portable zip.
# Run it from the Actions tab: "Release" > "Run workflow".
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, without the v"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/Mirage.Tests -c Release

      - name: Publish Mirage.exe
        run: >
          dotnet publish src/Mirage.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.VERSION }} -o out/publish

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          Push-Location installer
          & $nsis /V2 "/DVERSION=$env:VERSION" mirage.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Move-Item "dist\Mirage-Setup-$env:VERSION.exe" dist\Mirage-Setup.exe

      - name: Build portable zip and checksums
        shell: pwsh
        run: |
          $p = "out\portable\Mirage"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item out\publish\Mirage.exe, LICENSE $p
          "Mirage portable`r`n`r`nThis file turns on portable mode: settings and notes are kept in the ""data"" folder next to Mirage.exe.`r`nDelete it to use %APPDATA%\Mirage instead.`r`n" | Set-Content -NoNewline "$p\portable.txt"
          Compress-Archive -Path $p -DestinationPath dist\Mirage-Portable.zip -Force
          git archive --format=zip --prefix=mirage-launcher/ -o dist/Mirage-Source.zip HEAD
          $sums = Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $sums | Set-Content dist\SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          Mirage $env:VERSION, a touchpad-first glass launcher for Windows.

          - **Mirage-Setup.exe**: per-user installer, no admin rights needed.
          - **Mirage-Portable.zip**: unzip anywhere and run Mirage.exe.
          - **SHA256SUMS.txt**: checksums for the downloads.

          The installer isn't code-signed yet, so Windows SmartScreen may ask you to confirm with More info, then Run anyway.
          "@
          gh release create "v$env:VERSION" dist\Mirage-Setup.exe dist\Mirage-Portable.zip dist\Mirage-Source.zip dist\SHA256SUMS.txt --target $env:GITHUB_SHA --title "Mirage $env:VERSION" --notes $notes
